title: 'One SVG, nine posters: CSS linked parameters'
desc: 'An SVG placed as a content image or a background image has always been a styling dead end: you can put it on the page, but you can’t paint it. CSS Linked Parameters finally change that, and Firefox Nightly is the first browser to try. Let’s print a Warhol with it.'
